group = 'org.flow.fixture'
dependencies {
    compileOnly project(':core')
    compileOnly project(':script')
    annotationProcessor project(':processor')
}

tasks.named('jar') {
    archiveFileName = "${project.group.toString().replace('.', '_')}__${project.name}__${project.version.toString().replace('.', '_')}.jar"
}

tasks.register('stagePlugin', Sync) {
    from tasks.named('jar')
    into layout.buildDirectory.dir('plugin-release')
}
