id: purge_kv
namespace: sanitychecks.core

tasks:
  - id: set_expired_key
    type: org.flow.plugin.core.kv.Set
    key: KV_expired_key
    value: "my expired key"
    kvType: STRING
    ttl: PT0.001S

  - id: set_key
    type: org.flow.plugin.core.kv.Set
    key: KV_key
    value: "my key"
    kvType: STRING

  - id: purge_kv
    type: org.flow.plugin.core.kv.PurgeKV
    namespaces:
      - sanitychecks.core
    behavior:
      type: key
      expiredOnly: false
    keyPattern: KV_*

  - id: kv_getkeys
    type: org.flow.plugin.core.kv.GetKeys
    prefix: KV_

  - id: assert_purge_output
    type: org.flow.plugin.core.execution.Assert
    errorMessage: "Invalid number of deleted keys {{ outputs.purge_kv.size }}"
    conditions:
      - "{{ outputs.purge_kv.size == 2 }}"

  - id: assert_key_found_output
    type: org.flow.plugin.core.execution.Assert
    errorMessage: "Invalid number of deleted keys {{ outputs.kv_getkeys.keys }}"
    conditions:
      - "{{ outputs.kv_getkeys.keys.size() == 0 }}"