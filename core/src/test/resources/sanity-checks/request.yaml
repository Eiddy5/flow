id: request
namespace: sanitycheck.plugin.core.http

tasks:
  - id: request
    type: org.flow.plugin.core.http.Request
    uri: https://www.google.com
    method: GET
    options:
      timeout:
        connectTimeout: PT1M

  - id: assert
    type: org.flow.plugin.core.execution.Assert
    errorMessage: "Invalid response code {{ outputs.request.code }}"
    conditions:
      - "{{ outputs.request.code == 200 }}"