id: allow_failure
namespace: sanitychecks.core

tasks:
  - id: allow_failure
    type: org.flow.plugin.core.flow.AllowFailure
    tasks:
      - id: hello
        type: org.flow.plugin.core.log.Log
        message: Hello World! 🚀
        level: ERROR

      - id: error
        type: org.flow.plugin.core.log.Log
        message: "{{ inputs.test }}"
    errors:
      - id: exec_success
        type: org.flow.plugin.core.execution.Exit
        state: SUCCESS
  