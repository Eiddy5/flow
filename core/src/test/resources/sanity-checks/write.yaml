id: write
namespace: sanitychecks.core

tasks:
  - id: write
    type: org.flow.plugin.core.storage.Write
    content: |
      test
    extension: .txt

  - id: return
    type: org.flow.plugin.core.debug.Return
    format: "{{read(outputs.write.uri)}}"

  - id: assertContent
    type: org.flow.plugin.core.execution.Fail
    condition: "{{ outputs.return.value != 'test\n'}}"
  