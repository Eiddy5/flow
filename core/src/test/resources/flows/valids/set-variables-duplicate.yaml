id: set-variables-duplicate
namespace: org.flow.tests

variables:
  name: World

tasks:
  - id: set-vars
    type: org.flow.plugin.core.execution.SetVariables
    variables:
      message: Hello
      name: Loïc
    overwrite: false
  - id: output
    type: org.flow.plugin.core.output.OutputValues
    values:
      message: "{{ vars.message }} {{ vars.name }}"