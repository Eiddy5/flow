id: pause-duration-from-input
namespace: org.flow.tests

inputs:
  - id: delay
    type: DURATION
    defaults: PT1S

tasks:
  - id: pause
    type: org.flow.plugin.core.flow.Pause
    pauseDuration: "{{inputs.delay}}"
  - id: last
    type: org.flow.plugin.core.debug.Return
    format: "{{task.id}} > {{taskrun.startDate}}"
