id: input-log-secret
namespace: org.flow.tests

inputs:
  - id: secret
    type: SECRET
    defaults: password

  - id: nested.key
    type: SECRET
    defaults: password

tasks:
  - id: log-secret
    type: org.flow.plugin.core.log.Log
    message: "These are my secrets: {{inputs.nested.key}} - {{inputs.secret}}"