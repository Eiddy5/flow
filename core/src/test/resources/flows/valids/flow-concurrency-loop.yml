id: flow-concurrency-loop
namespace: org.flow.tests

concurrency:
  behavior: QUEUE
  limit: 1

tasks:
  - id: loop_items
    type: org.flow.plugin.core.flow.Loop
    concurrencyLimit: 1
    values:
      - "a"
      - "b"
      - "c"
    tasks:
      - id: log_item
        type: org.flow.plugin.core.debug.Return
        format: "processing item: {{ item.value }}"
