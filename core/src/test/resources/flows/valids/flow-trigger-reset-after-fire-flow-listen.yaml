id: flow-trigger-reset-after-fire-flow-listen
namespace: org.flow.tests.trigger.reset.after.fire

triggers:
  - id: flow
    type: org.flow.plugin.core.trigger.Flow
    dependsOn:
      - namespace: org.flow.tests.trigger.reset.after.fire
        flowId: flow-trigger-reset-after-fire-flow-a
        states: [SUCCESS]
      - namespace: org.flow.tests.trigger.reset.after.fire
        flowId: flow-trigger-reset-after-fire-flow-b
        states: [SUCCESS]
    window:
      every: P1D

tasks:
  - id: only
    type: org.flow.plugin.core.debug.Return
    format: "It works"
