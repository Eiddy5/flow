id: flow-trigger-depends-on-outputs-flow-listen
namespace: org.flow.tests.trigger.depends.on.outputs

triggers:
  - id: listen
    type: org.flow.plugin.core.trigger.Flow
    dependsOn:
      - namespace: org.flow.tests.trigger.depends.on.outputs
        flowId: flow-trigger-depends-on-outputs-flow-a
        states: [SUCCESS]
      - namespace: org.flow.tests.trigger.depends.on.outputs
        flowId: flow-trigger-depends-on-outputs-flow-b
        states: [SUCCESS]

tasks:
  - id: only
    type: org.flow.plugin.core.debug.Return
    format: "{{ trigger.outputs }}"
