id: loop-until-restart
namespace: org.flow.tests

tasks:
  - id: loop_test
    type: org.flow.plugin.core.flow.LoopUntil
    condition: "{{ false }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT1S
      maxDuration: PT3S
    tasks:
      - id: return_test
        type: org.flow.plugin.core.debug.Return
        format: "{{outputs.loop_test.iterationCount}}"
