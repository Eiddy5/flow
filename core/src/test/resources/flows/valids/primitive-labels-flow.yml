id: primitive-labels-flow
namespace: org.flow.tests

inputs:
  - id: intLabel
    type: INT
  - id: floatLabel
    type: FLOAT
  - id: boolLabel
    type: BOOL

tasks:
  - id: update-labels
    type: org.flow.plugin.core.execution.Labels
    labels:
      intValue: "{{inputs.intLabel}}"
      floatValue: "{{inputs.floatLabel}}"
      boolValue: "{{inputs.boolLabel}}"
      taskRunId: "{{taskrun.id}}"