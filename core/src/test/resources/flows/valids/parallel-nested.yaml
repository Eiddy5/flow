id: parallel-nested
namespace: org.flow.tests

tasks:
  - id: 1_par
    type: org.flow.plugin.core.flow.Parallel
    tasks:
      - id: 1-1
        type: org.flow.plugin.core.debug.Return
        format: "{{task.id}} > {{taskrun.startDate}}"
      - id: 1-2
        type: org.flow.plugin.core.debug.Return
        format: "{{task.id}} > {{taskrun.id}}"
      - id: 1-3_par
        type: org.flow.plugin.core.flow.Parallel
        tasks:
          - id: 1-3-1
            type: org.flow.plugin.core.debug.Return
            format: "{{task.id}} > {{taskrun.id}}"
          - id: 1-3-2_par
            type: org.flow.plugin.core.flow.Sequential
            tasks:
              - id: 1-3-2-1
                type: org.flow.plugin.core.debug.Return
                format: "{{task.id}} > {{taskrun.startDate}}"
              - id: 1-3-2-2_end
                type: org.flow.plugin.core.debug.Return
                format: "{{task.id}} > {{taskrun.id}}"
          - id: 1-3-3_end
            type: org.flow.plugin.core.debug.Return
            format: "{{task.id}} > {{taskrun.id}}"
      - id: 1-4_end
        type: org.flow.plugin.core.debug.Return
        format: "{{task.id}} > {{taskrun.startDate}}"
  - id: 2_end
    type: org.flow.plugin.core.debug.Return
    format: "{{task.id}} > {{taskrun.startDate}}"
