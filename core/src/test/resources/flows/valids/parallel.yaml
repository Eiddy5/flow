id: parallel
namespace: org.flow.tests

tasks:
  - id: parent
    type: org.flow.plugin.core.flow.Parallel
    tasks:
      - id: t1
        type: org.flow.plugin.core.log.Log
        message: "{{ task.id }}"
      - id: t2
        type: org.flow.plugin.core.log.Log
        message: "{{ task.id }}"
      - id: t3
        type: org.flow.plugin.core.log.Log
        message: "{{ task.id }}"
      - id: t4
        type: org.flow.plugin.core.log.Log
        message: "{{ task.id }}"
      - id: t5
        type: org.flow.plugin.core.log.Log
        message: "{{ task.id }}"
      - id: t6
        type: org.flow.plugin.core.log.Log
        message: "{{ task.id }}"
  - id: last
    type: org.flow.plugin.core.debug.Return
    format: "{{task.id}} > {{taskrun.startDate}}"
