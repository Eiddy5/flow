id: pause-behavior
namespace: org.flow.tests

inputs:
  - id: behavior
    type: STRING
    defaults: RESUME

tasks:
  - id: pause
    type: org.flow.plugin.core.flow.Pause
    pauseDuration: PT1S
    behavior: "{{inputs.behavior}}"
  - id: last
    type: org.flow.plugin.core.debug.Return
    format: "{{task.id}}"
