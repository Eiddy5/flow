id: webhook-inputs
namespace: org.flow.tests
inputs:
  - id: body
    type: STRING
tasks:
  - id: out
    type: org.flow.plugin.core.debug.Return
    format: "{{ inputs.body }}"
triggers:
  - id: webhook
    type: org.flow.plugin.core.trigger.Webhook
    key: webhookKey
    inputs:
      body: "{{ trigger.body }}"
