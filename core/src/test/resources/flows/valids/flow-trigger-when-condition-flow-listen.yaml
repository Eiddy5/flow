id: flow-trigger-when-condition-flow-listen
namespace: org.flow.tests.trigger.when.condition

triggers:
  - id: on_completion
    type: org.flow.plugin.core.trigger.Flow
    states: [ SUCCESS ]
    when: '{{ labels contains "source" ? labels.source == "when-test" : false }}'

tasks:
  - id: only
    type: org.flow.plugin.core.debug.Return
    format: "It works"
