id: waitfor-child-task-warning
namespace: org.flow.tests

tasks:
  - id: loop
    type: org.flow.plugin.core.flow.WaitFor
    condition: "{{ outputs.check_migration_task.values['test'] == 'FINISHED' }}"
    failOnMaxReached: true
    checkFrequency:
      interval: PT1S
      maxDuration: PT3S
    tasks:

      ## forcing a Warning
      - id: allow_failure
        allowFailure: true
        type: org.flow.plugin.core.execution.Fail

      - id: check_migration_task
        type: org.flow.plugin.core.output.OutputValues
        values:
          test: "ok"