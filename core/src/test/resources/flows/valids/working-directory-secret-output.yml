id: working-directory-secret-output
namespace: org.flow.tests

tasks:
  - id: workingDir
    type: org.flow.plugin.core.flow.WorkingDirectory
    tasks:
      - id: encrypted
        type: org.flow.core.tasks.test.Encrypted
        format: "my-super-secret-value"
      - id: log
        type: org.flow.plugin.core.log.Log
        message: "secret is {{ outputs.encrypted.value }}"
