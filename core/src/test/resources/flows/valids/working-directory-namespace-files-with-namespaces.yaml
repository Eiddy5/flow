id: working-directory-namespace-files-with-namespaces
namespace: org.flow.tests

tasks:
  - id: allow
    type: org.flow.plugin.core.flow.AllowFailure
    tasks:
      - id: worker
        type: org.flow.plugin.core.flow.WorkingDirectory
        namespaceFiles:
          namespaces:
            - io.test.first
            - io.test.second
            - io.test.third
          enabled: true
          folderPerNamespace: true
          exclude:
            - /ignore/**
        tasks:
          - id: t1
            type: org.flow.core.tasks.test.Read
            path: "/io.test.third/test/a/b/c/1.txt"
          - id: t2
            type: org.flow.core.tasks.test.Read
            path: "/io.test.second/a/b/c/2.txt"
          - id: t3
            type: org.flow.core.tasks.test.Read
            path: "/io.test.first/a/b/3.txt"
          - id: t4
            type: org.flow.core.tasks.test.Read
            path: "/ignore/4.txt"
