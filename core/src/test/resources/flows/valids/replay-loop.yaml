id: replay-loop
namespace: org.flow.tests

inputs:
  - id: failed
    type: STRING

tasks:
  - id: 1_each
    type: org.flow.plugin.core.flow.Loop
    concurrencyLimit: 0
    values: '["value 1", "value 2", "value 3"]'
    tasks:
      - id: 2-1_seq
        type: org.flow.plugin.core.flow.Sequential
        tasks:
          - id: 2-1-1_t1
            type: org.flow.plugin.core.log.Log
            message: "{{ (inputs.failed ?? 'NONE') == 'FIRST' ? ko : '0'}}"
          - id: 2-1-2_t2
            type: org.flow.plugin.core.flow.Loop
            concurrencyLimit: 0
            values: '["value a", "value b", "value c"]'
            tasks:
              - id: 2-1-2-1_t1
                type: org.flow.plugin.core.log.Log
                message: "{{ (inputs.failed ?? 'NONE') == 'SECOND' ? ko : '0'}}"

  - id: 2_end
    type: org.flow.plugin.core.debug.Return
    format: "{{task.id}} > {{taskrun.startDate}}"

