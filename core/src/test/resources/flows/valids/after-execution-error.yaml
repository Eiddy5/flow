id: after-execution-error
namespace: org.flow.tests

tasks:
  - id: fail
    type: org.flow.plugin.core.execution.Fail

errors:
  - id: hello
    type: org.flow.plugin.core.log.Log
    message: I'm failing

afterExecution:
  - id: end
    type: org.flow.plugin.core.output.OutputValues
    values:
      state: "{{execution.state}}"