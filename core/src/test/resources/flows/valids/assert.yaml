id: assert
namespace: org.flow.tests

tasks:
  - id: before
    type: org.flow.plugin.core.output.OutputValues
    values:
      output1: xyz
      output2: abc
      taskInfo: "{{ task.id }} > {{ taskrun.startDate }}"
  - id: fail
    type: org.flow.plugin.core.execution.Assert
    conditions:
      - "{{ 42 == 42 }}"
      - "{{ outputs.before.values.output1  == 'xyz' }}"
      - "{{ outputs.before.values.output2  == 'xyz' }}"