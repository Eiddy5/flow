id: parallel-fail-fast-errors
namespace: org.flow.tests

tasks:
  - id: parallel
    type: org.flow.plugin.core.flow.Parallel
    onChildFailure: CANCEL
    errors:
      - id: e1
        type: org.flow.plugin.core.log.Log
        message: "handled"
    finally:
      - id: f1
        type: org.flow.plugin.core.log.Log
        message: "cleaned up"
    tasks:
      - id: fails_fast
        type: org.flow.plugin.core.execution.Fail

      - id: sleep
        type: org.flow.plugin.core.flow.Sleep
        duration: PT10S
