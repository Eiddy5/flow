id: pause_on_resume
namespace: org.flow.tests

tasks:
  - id: pause
    type: org.flow.plugin.core.flow.Pause
    onResume:
      - id: asked
        type: STRING
      - id: data
        type: FILE
        required: false
      - id: secret_pause
        type: SECRET


  - id: last
    type: org.flow.plugin.core.output.OutputValues
    values:
      asked: "{{outputs.pause.onResume.asked}}"
      data: "{{outputs.pause.onResume.data}}"
      secret_pause: "{{outputs.pause.onResume.secret_pause}}"