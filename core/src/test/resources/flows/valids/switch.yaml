id: switch
namespace: org.flow.tests

inputs:
  - id: string
    type: STRING
  - id: def
    type: STRING
    defaults: amazing

labels:
  switchFlowLabel: switchFoo
  overriding: child

tasks:
  - id: parent-seq
    type: org.flow.plugin.core.flow.Switch
    value: "{{inputs.string}}"
    cases:
      FIRST:
        - id: t1
          type: org.flow.plugin.core.debug.Return
          format: "{{task.id}} > {{taskrun.startDate}}"
      SECOND:
        - id: t2
          type: org.flow.plugin.core.debug.Return
          format: "{{task.id}} > {{taskrun.startDate}}"
        - id: t2_sub
          type: org.flow.plugin.core.debug.Return
          format: "{{task.id}} > {{taskrun.startDate}}"
      THIRD:
        - id: t3
          type: org.flow.plugin.core.flow.Sequential
          tasks:
            - id: failed
              type: org.flow.plugin.core.execution.Fail
          errors:
            - id: error-t1
              type: org.flow.plugin.core.debug.Return
              format: "Error Trigger ! {{task.id}}"
    defaults:
      - id: default
        type: org.flow.plugin.core.debug.Return
        format: "{{task.id}} > {{ inputs.def }} > {{taskrun.startDate}}"

triggers:
  - id: schedule
    type: org.flow.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    inputs:
      string: FIRST