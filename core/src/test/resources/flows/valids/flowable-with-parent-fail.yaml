id: flowable-with-parent-fail
namespace: org.flow.tests

tasks:
  - id: vision
    type: org.flow.plugin.core.flow.Loop
    concurrencyLimit: 0
    values: "[\"MONTHLY\", \"CUMULATIVE\"]"
    tasks:
      - id: metaseg_date
        type: org.flow.plugin.core.flow.Loop
        concurrencyLimit: 0
        values: "[{\"NEW_MONTH\":\"2018-01-01\"}]"
        tasks:
          - id: if
            type: org.flow.plugin.core.flow.If
            condition: "{{item.parent.value == 'CUMULATIVE' and {% for entry in json(item.value) %}{{ entry.key }}{% endfor %}== 'NEW_MONTH'}}"
            then:
              - id: when-true
                type: org.flow.plugin.core.log.Log
                message: 'Condition was true'
            else:
              - id: when-false
                type: org.flow.plugin.core.log.Log
                message: 'Condition was false'
