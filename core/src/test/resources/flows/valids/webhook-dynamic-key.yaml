id: webhook-dynamic-key
namespace: org.flow.tests
labels:
  flow-label-1: flow-label-1
  flow-label-2: flow-label-2

tasks:
  - id: out
    type: org.flow.plugin.core.debug.Return
    format: "{{trigger | json }}"


triggers:
  - id: webhook
    type: org.flow.plugin.core.trigger.Webhook
    key: "{{ flow.id }}"
