id: working-directory
namespace: org.flow.tests

inputs:
  - id: failed
    type: STRING

tasks:
  - id: worker
    type: org.flow.plugin.core.flow.WorkingDirectory
    tasks:
      - id: first
        type: org.flow.plugin.core.flow.WorkingDirectoryTest$LocalFiles
        inputs:
          out/stay.txt: "{{ inputs.failed == 'true' ? ko: taskrun.id }}"
      - id: second
        type: org.flow.plugin.core.flow.WorkingDirectoryTest$LocalFiles
        outputs:
          - out/*
      - id: disabled
        type: org.flow.plugin.core.debug.Return
        disabled: true
    errors:
      - id: error-t1
        type: org.flow.plugin.core.debug.Return
        format: "Error Trigger ! {{task.id}}"
  - id: 2_end
    type: org.flow.plugin.core.debug.Return
    format: "{{ outputs.second.uris['out/stay.txt'] }}"