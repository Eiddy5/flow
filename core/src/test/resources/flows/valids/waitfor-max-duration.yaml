id: waitfor-max-duration
namespace: org.flow.tests

tasks:
  - id: waitfor
    type: org.flow.plugin.core.flow.WaitFor
    condition: "{{ outputs.output_values.values.count == '-5'}}"
    checkFrequency:
      maxDuration: PT5S
      interval: PT0.2S
    failOnMaxReached: true
    tasks:
      - id: output_values
        type: org.flow.plugin.core.output.OutputValues
        values:
          count: "{{ outputs.waitfor.iterationCount + 1 }}"