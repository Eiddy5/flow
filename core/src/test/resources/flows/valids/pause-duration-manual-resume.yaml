id: pause-duration-manual-resume
namespace: org.flow.tests

tasks:
  - id: pause
    type: org.flow.plugin.core.flow.Pause
    pauseDuration: PT5S
    onResume:
      - id: reason
        type: STRING
  - id: sleep
    type: org.flow.plugin.core.flow.Sleep
    duration: PT10S
  - id: last
    type: org.flow.plugin.core.output.OutputValues
    values:
      reason: "{{ outputs.pause.onResume.reason }}"
