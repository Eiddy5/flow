id: loop-map
namespace: org.flow.tests

tasks:
  - id: loop
    type: org.flow.plugin.core.flow.Loop
    concurrencyLimit: 1
    values:
      key1: value 1
      key2: value 2
      key3: value 3
    tasks:
      - id: item
        type: org.flow.plugin.core.debug.Return
        format: "{{item.key}} - {{item.value}}"
