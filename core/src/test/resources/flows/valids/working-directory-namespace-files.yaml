id: working-directory-namespace-files
namespace: org.flow.tests

tasks:
  - id: allow
    type: org.flow.plugin.core.flow.AllowFailure
    tasks:
      - id: worker
        type: org.flow.plugin.core.flow.WorkingDirectory
        namespaceFiles:
          enabled: true
          exclude:
            - /ignore/**
        tasks:
          - id: t1
            type: org.flow.core.tasks.test.Read
            path: "/test/a/b/c/1.txt"
          - id: t2
            type: org.flow.core.tasks.test.Read
            path: "/a/b/c/2.txt"
          - id: t3
            type: org.flow.core.tasks.test.Read
            path: "/a/b/3.txt"
          - id: t4
            type: org.flow.core.tasks.test.Read
            path: "/ignore/4.txt"
