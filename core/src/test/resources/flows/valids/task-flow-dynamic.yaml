id: task-flow-dynamic
namespace: org.flow.tests

inputs:
  - id: string
    type: STRING

labels:
  mainFlowLabel: flowFoo

tasks:
  - id: launch
    type: org.flow.plugin.core.flow.Subflow
    namespace: "{{inputs.namespace}}"
    flowId: "{{inputs.flowId}}"
    inputs:
      string: "{{ inputs.string }}"
    wait: true
    transmitFailed: true
    inheritLabels: true
    labels:
      launchTaskLabel: launchFoo