id: finally-flow-error
namespace: org.flow.tests

inputs:
  - id: failed
    type: BOOL
    defaults: false

tasks:
  - id: if
    type: org.flow.plugin.core.flow.If
    condition: "{{ inputs.failed == false }}"
    then:
      - id: ok
        type: org.flow.plugin.core.debug.Return
        format: "{{ task.id }}"
    else:
      - id: ko
        type: org.flow.plugin.core.execution.Fail

errors:
  - id: e1
    type: org.flow.plugin.core.debug.Return
    format: "{{ task.id }}"

  - id: e2
    type: org.flow.plugin.core.debug.Return
    format: "{{ task.id }}"

finally:
  - id: a1
    type: org.flow.plugin.core.debug.Return
    format: "{{ task.id }}"

  - id: a2
    type: org.flow.plugin.core.debug.Return
    format: "{{ task.id }}"