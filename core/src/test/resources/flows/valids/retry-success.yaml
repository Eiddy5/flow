id: retry-success
namespace: org.flow.tests

tasks:
- id: failed
  type: org.flow.plugin.core.log.Log
  message: "{{ taskrun.attemptsCount == 3 ? 'ok' : ko}}"
  retry:
    type: constant
    interval: PT0.250S
    maxAttempts: 4
    maxDuration: PT15S
    warningOnRetry: true

errors:
  - id: never-happen
    type: org.flow.plugin.core.log.Log
    message: Never {{task.id}}
