id: restart_with_inputs
namespace: org.flow.tests

inputs:
  - id: string
    type: STRING
  - id: optional
    type: STRING
    required: false
  - id: int
    type: INT
  - id: float
    type: FLOAT
  - id: instant
    type: DATETIME
  - id: file
    type: FILE
  - id: optionalFile
    type: FILE
    required: false

tasks:
  - id: string
    type: org.flow.plugin.core.debug.Return
    format: "{{inputs.string}}"
  - id: int
    type: org.flow.plugin.core.debug.Return
    format: "{{inputs.int}}"
  - id: float
    type: org.flow.plugin.core.debug.Return
    format: "{{inputs.float}}"
  - id: instant
    type: org.flow.plugin.core.debug.Return
    format: "{{inputs.instant}}"
  - id: file
    type: org.flow.plugin.core.debug.Return
    format: "{{inputs.file}}"
