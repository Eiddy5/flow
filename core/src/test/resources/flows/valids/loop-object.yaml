id: loop-object
namespace: org.flow.tests

tasks:
  - id: 1_each
    type: org.flow.plugin.core.flow.Loop
    concurrencyLimit: 1
    values: |
      [
        "value 1",
        {"key": "my-key", "value": "my-value"},
        {"key": "my-complex", "value": {"sub": 1, "bool": true}}
      ]

    tasks:
      - id: is-json
        type: org.flow.plugin.core.flow.Switch
        value: "{{ item.value is json }}"
        cases:
          "false":
            - id: not-json
              type: org.flow.plugin.core.debug.Return
              format: "{{task.id}} > STRING > {{item.value}}"
        defaults:
        - id: json
          type: org.flow.plugin.core.debug.Return
          format: "{{task.id}} > JSON > {{ item.value | jq('.key') }} > {{ item.value | jq('.value') }}"

  - id: 2_end
    type: org.flow.plugin.core.debug.Return
    format: "{{task.id}} > {{taskrun.startDate}}"
