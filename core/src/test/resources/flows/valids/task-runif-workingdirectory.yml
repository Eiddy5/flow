id: task-runif-workingdirectory
namespace: org.flow.tests

inputs:
  - id: scripts_to_run
    type: MULTISELECT
    required: true
    values:
      - "orders"
      - "carriers"
      - "transactions"
    defaults: ["orders"]

tasks:
  - id: fileSystem
    type: org.flow.plugin.core.flow.WorkingDirectory
    tasks:

      - id: log_orders
        type: org.flow.plugin.core.log.Log
        message: "{{ inputs.scripts_to_run contains 'orders' }}"
        runIf: "{{ inputs.scripts_to_run contains 'orders' }}"

      - id: log_test
        type: org.flow.plugin.core.log.Log
        message: "{{ inputs.scripts_to_run contains 'test' }}"
        runIf: "{{ inputs.scripts_to_run contains 'test' }}"