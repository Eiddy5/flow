id: fail-on-condition
namespace: org.flow.tests

inputs:
  - id: param
    type: STRING
    required: true

tasks:
  - id: before
    type: org.flow.plugin.core.log.Log
    message: I'm before the fail on condition
  - id: fail
    type: org.flow.plugin.core.execution.Fail
    condition: '{{inputs.param == "fail"}}'
  - id: after
    type: org.flow.plugin.core.log.Log
    message: I'm after the fail on condition