id: trigger-flow-listener-with-concurrency-limit
namespace: org.flow.tests.trigger.concurrency

outputs:
  - id: status
    type: STRING
    value: "{{trigger.state}}"
  - id: executionId
    type: STRING
    value: "{{trigger.executionId}}"

triggers:
  - id: flow
    type: org.flow.plugin.core.trigger.Flow
    states:
      - QUEUED
      - RUNNING
      - SUCCESS
    dependsOn:
      - namespace: org.flow.tests.trigger.concurrency
        flowId: trigger-flow-with-concurrency-limit
        states:
          - QUEUED
          - RUNNING
          - SUCCESS

tasks:
  - id: hello
    type: org.flow.plugin.core.log.Log
    message: Hello {{trigger.executionId}} you're in {{trigger.state}}