id: if
namespace: org.flow.tests

inputs:
  - id: if1
    type: BOOL

  - id: if2
    type: BOOL

  - id: if3
    type: BOOL

tasks:
  - id: parallel
    type: org.flow.plugin.core.flow.Parallel
    concurrent: 4
    tasks:
      - id: if-1
        type: org.flow.plugin.core.flow.If
        condition: "{{ inputs.if1 }}"
        then:
          - id: if-1-log
            type: org.flow.plugin.core.log.Log
            message: "Hello World!"
      - id: if-2
        type: org.flow.plugin.core.flow.If
        condition: "{{ inputs.if2 }}"
        then:
          - id: if-2-log
            type: org.flow.plugin.core.log.Log
            message: "Hello World!"
      - id: if-3
        type: org.flow.plugin.core.flow.If
        condition: "{{ inputs.if3 }}"
        then:
          - id: if-3-log
            type: org.flow.plugin.core.log.Log
            message: "Hello World!"
      - id: log-parallel-1
        type: org.flow.plugin.core.log.Log
        message: "Hello World!"
      - id: log-parallel-2
        type: org.flow.plugin.core.log.Log
        message: "Hello World!"
      - id: log-parallel-3
        type: org.flow.plugin.core.log.Log
        message: "Hello World!"
      - id: log-parallel-4
        type: org.flow.plugin.core.log.Log
        message: "Hello World!"
      - id: log-parallel-5
        type: org.flow.plugin.core.log.Log
        message: "Hello World!"
      - id: log-parallel-6
        type: org.flow.plugin.core.log.Log
        message: "Hello World!"