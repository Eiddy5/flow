id: purge_logs_full_arguments
namespace: org.flow.tests

tasks:
  - id: purge_logs
    type: org.flow.plugin.core.log.PurgeLogs
    endDate: "{{ now() | dateAdd(2, 'HOURS') }}"
    startDate: "{{ now() | dateAdd(-2, 'HOURS') }}"
    namespace: purge.namespace
    flowId: purgeFlowId
    logLevels:
      - INFO
      - ERROR