id: finally-dag
namespace: org.flow.tests

inputs:
  - id: failed
    type: BOOL
    defaults: false

tasks:
  - id: dag
    type: org.flow.plugin.core.flow.Dag
    tasks:
      - task:
          id: t1
          type: org.flow.plugin.core.log.Log
          message: "{{ task.id }}"
      - task:
          id: t2
          type: org.flow.plugin.core.log.Log
          message: "{{ task.id }}"
        dependsOn:
          - t1
      - task:
          id: t3
          type: org.flow.plugin.core.flow.If
          condition: "{{ inputs.failed == false }}"
          then:
            - id: ok
              type: org.flow.plugin.core.debug.Return
              format: "{{ task.id }}"
          else:
            - id: ko
              type: org.flow.plugin.core.execution.Fail
        dependsOn:
          - t2

    errors:
      - id: e1
        type: org.flow.plugin.core.debug.Return
        format: "{{ task.id }}"

      - id: e2
        type: org.flow.plugin.core.debug.Return
        format: "{{ task.id }}"

    finally:
      - id: a1
        type: org.flow.plugin.core.debug.Return
        format: "{{ task.id }}"

      - id: a2
        type: org.flow.plugin.core.debug.Return
        format: "{{ task.id }}"