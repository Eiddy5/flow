id: subflow-function-mutual-a
namespace: org.flow.tests

# Mutual recursion a -> b -> a -> ... Each hop targets a *different* flow, so the self-call check
# does not fire; only the per-thread depth cap can stop it.
inputs:
  - id: x
    type: STRING
    defaults: "{{ subflow(namespace='org.flow.tests', id='subflow-function-mutual-b').outputs.x }}"

tasks:
  - id: hello
    type: org.flow.plugin.core.debug.Return
    format: "{{ inputs.x }}"

outputs:
  - id: x
    type: STRING
    value: "{{ inputs.x }}"
