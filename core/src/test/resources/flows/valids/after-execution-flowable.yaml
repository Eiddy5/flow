id: after-execution-flowable
namespace: org.flow.tests

tasks:
  - id: mytask
    type: org.flow.plugin.core.debug.Return
    format: done

afterExecution:
  - id: after_if
    type: org.flow.plugin.core.flow.If
    condition: "{{ true }}"
    then:
      - id: after_if_log
        type: org.flow.plugin.core.log.Log
        message: after execution if child ran

  - id: after_end
    type: org.flow.plugin.core.log.Log
    message: after execution following task ran
