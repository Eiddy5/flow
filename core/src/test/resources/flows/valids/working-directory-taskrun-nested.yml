id: working-directory-taskrun-nested
namespace: org.flow.tests

tasks:
  - id: parallel
    type: org.flow.plugin.core.flow.Loop
    concurrencyLimit: 0
    values: ["1"]
    tasks:
      - id: seq
        type: org.flow.plugin.core.flow.Sequential
        tasks:
          - id: workingDir
            type: org.flow.plugin.core.flow.WorkingDirectory
            tasks:
              - id: log-taskrun
                type: org.flow.plugin.core.debug.Return
                format: "{{ workerTaskrun }}"
              - id: log-workerparents
                type: org.flow.plugin.core.debug.Return
                format:  "{{ parents }}"
              - id: log-workerparent
                type: org.flow.plugin.core.debug.Return
                format:  "{{ parent }}"