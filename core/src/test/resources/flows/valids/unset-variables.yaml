id: unset-variables
namespace: org.flow.tests

tasks:
  - id: set-vars
    type: org.flow.plugin.core.execution.SetVariables
    variables:
      message: Hello World
  - id: unset-variables
    type: org.flow.plugin.core.execution.UnsetVariables
    variables:
      - message
  - id: output
    type: org.flow.plugin.core.output.OutputValues
    values:
      message: "{{ vars.message ??? 'default' }}"