id: flow-concurrency-sla-assert-cancel
namespace: org.flow.tests

concurrency:
  behavior: QUEUE
  limit: 1

sla:
  - id: alwaysViolated
    type: EXECUTION_ASSERTION
    behavior: CANCEL
    assert: "{{ false }}"

tasks:
  - id: return
    type: org.flow.plugin.core.debug.Return
    format: "true"
