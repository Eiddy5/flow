id: restart-with-finally
namespace: org.flow.tests

tasks:
  - id: hello
    type: org.flow.plugin.core.log.Log
    message: Hello World! 🚀

  - id: fail_randomly
    type: org.flow.plugin.core.execution.Fail
    runIf: "{{taskrun.attemptsCount == 0}}"
    errorMessage: Bad value returned!

  - id: log
    type: org.flow.plugin.core.log.Log
    message: should finish here

finally:
  - id: end
    type: org.flow.plugin.core.log.Log
    message: finally!