id: waitfor-no-success
namespace: org.flow.tests

tasks:
  - id: waitfor
    type: org.flow.plugin.core.flow.WaitFor
    condition: "{{ outputs.output_values.values.count == '6'}}"
    checkFrequency:
      maxIterations: 5
      interval: PT0.2S
    tasks:
      - id: output_values
        type: org.flow.plugin.core.output.OutputValues
        values:
          count: "{{ outputs.waitfor.iterationCount + 1 }}"