id: loopuntil-failed-flowable
namespace: org.flow.tests

tasks:
  - id: loop
    type: org.flow.plugin.core.flow.LoopUntil
    condition: "{{ outputs.loop.iterationCount < \"5\" }}"
    checkFrequency:
      interval: PT1S
    tasks:
      - id: loop_dag
        type: org.flow.plugin.core.flow.Dag
        tasks:
          - task:
              id: log
              type: org.flow.plugin.core.log.Log
              message: |
                Iteration: {{ outputs.loop.iterationCount }}