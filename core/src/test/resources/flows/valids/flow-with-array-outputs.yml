id: flow-with-array-outputs
namespace: org.flow.tests

tasks:
  - id: return
    type: org.flow.plugin.core.output.OutputValues
    values:
      one: "1rstValue"
      two: "2ndValue"

outputs:
  - id: myout
    type: ARRAY
    value:
      - "{{ outputs.return.values.one }}"
      - "{{ outputs.return.values.two }}"