id: task-runif-executionupdating
namespace: org.flow.tests

variables:
  list: []

tasks:
  - id: output
    type: org.flow.plugin.core.output.OutputValues
    values:
      taskrun_data: 1

  - id: unsetVariables
    type: org.flow.plugin.core.execution.UnsetVariables
    runIf: "true"
    variables:
      - list

  - id: setVariables
    type: org.flow.plugin.core.execution.SetVariables
    runIf: "{{ outputs.output['values']['taskrun_data'] == 1 }}"
    variables:
      list: [42]

  - id: skipSetVariables
    type: org.flow.plugin.core.execution.SetVariables
    runIf: "false"
    variables:
      list: [1]

  - id: skipUnsetVariables
    type: org.flow.plugin.core.execution.UnsetVariables
    runIf: "{{ outputs.output['values']['taskrun_data'] == 2 }}"
    variables:
      - list