id: allow-failure
namespace: org.flow.tests

inputs:
  - id: crash
    type: STRING

tasks:
  - id: first
    type: org.flow.plugin.core.flow.Sequential
    tasks:
      - id: 1-1-allow-failure
        type: org.flow.plugin.core.flow.AllowFailure
        tasks:
          - id: 1-1-1_seq
            type: org.flow.plugin.core.flow.Sequential
            tasks:
              - id: 1-1-1-1
                type: org.flow.plugin.core.debug.Return
                format: "{{task.id}} > {{taskrun.startDate}}"
              - id: ko
                type: org.flow.plugin.core.execution.Fail
              - id: 1-1-1-3
                type: org.flow.plugin.core.debug.Return
                format: "{{task.id}} > {{taskrun.startDate}}"
        errors:
          - id: local-error
            type: org.flow.plugin.core.debug.Return
            format: "Error Trigger ! {{task.id}}"
      - id: 1-2-todo
        type: org.flow.plugin.core.debug.Return
        format: "{{task.id}} > {{taskrun.startDate}}"
  - id: switch
    type: org.flow.plugin.core.flow.Switch
    value: "{{ inputs.crash is defined }}"
    cases:
      "true":
        - id: crash
          type: org.flow.plugin.core.execution.Fail
    defaults:
      - id: last
        type: org.flow.plugin.core.debug.Return
        format: "{{task.id}} > {{taskrun.startDate}}"


errors:
  - id: global-error
    type: org.flow.plugin.core.debug.Return
    format: "Error Trigger ! {{task.id}}"