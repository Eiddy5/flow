configurations {
    tests
}

tasks.register('copyGradleProperties', Copy) {
    group = "build"
    shouldRunAfter compileJava

    from '../gradle.properties'
    into layout.buildDirectory.dir('generated/version')
}

processResources.dependsOn copyGradleProperties
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/version')

tasks.withType(Test).configureEach {
    systemProperty 'flow.test-classpath', sourceSets.test.runtimeClasspath.asPath
}

dependencies {
    // Flow
    api project(':model')
    annotationProcessor project(':processor')

    // serializers
    implementation libs.jackson.dataformat.ion

    // reactor
    api libs.reactor.core

    // awaitility
    api libs.awaitility

    // Micronaut APIs exposed by native services; adapters remain implementation details.
    api platform(libs.micronaut.platform)
    api libs.micronaut.context
    api libs.micronaut.data.model
    api libs.micronaut.http
    implementation libs.micronaut.validation.runtime
    implementation libs.micronaut.hibernate.validator
    implementation libs.micronaut.jackson.databind
    implementation libs.micronaut.retry
    implementation libs.micronaut.micrometer.core
    implementation libs.micrometer.core
    runtimeOnly libs.micronaut.micrometer.registry.prometheus
    runtimeOnly libs.micronaut.tracing.opentelemetry
    runtimeOnly libs.micronaut.reactor
    annotationProcessor platform(libs.micronaut.platform)
    annotationProcessor libs.micronaut.inject.java
    annotationProcessor libs.micronaut.validation.processor

    // utils
    implementation libs.pebble
    implementation libs.logback.ecs.encoder
    implementation libs.jollyday.core
    implementation libs.jollyday.jaxb
    implementation libs.gitignore.reader
    implementation libs.failsafe
    implementation libs.caffeine
    implementation libs.ksuid
    api libs.httpclient5

    // plugins
    implementation libs.maven.resolver.impl
    implementation libs.maven.resolver.supplier.mvn3
    implementation libs.maven.resolver.connector.basic
    implementation libs.maven.resolver.transport.file
    implementation libs.maven.resolver.transport.apache

    // scheduler
    implementation libs.cron.utils

    // schema
    implementation (libs.jsonschema.generator) {
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation libs.jsonschema.module.jakarta.validation
    implementation libs.jsonschema.module.jackson
    implementation libs.jsonschema.module.swagger2

    // Json Diff
    implementation (libs.json.patch) {
        exclude group: 'com.fasterxml.jackson.core'
    }

    // Json schema validator
    implementation libs.json.schema.validator

    // micrometer
    implementation libs.micronaut.micrometer.observation
    implementation libs.micrometer.java21

    // test
    testAnnotationProcessor platform(libs.micronaut.platform)
    testAnnotationProcessor libs.micronaut.inject.java
    testAnnotationProcessor libs.micronaut.validation.processor
    testImplementation libs.micronaut.test.junit5
    testAnnotationProcessor project(':processor')
    testImplementation project(':tests')

    testImplementation project(':jdbc-postgres')
    testImplementation project(':storage-local')
    testImplementation project(':worker')
    testImplementation project(':scheduler')
    testImplementation project(':executor')
    testImplementation project(':indexer')

    testImplementation libs.micronaut.http.client
    testImplementation libs.micronaut.http.server.netty
    testImplementation libs.micronaut.management

    testImplementation libs.testcontainers.core
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.bcpkix.jdk18on

    testImplementation libs.wiremock.jetty12
}
