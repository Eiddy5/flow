dependencies {
    annotationProcessor(platform(libs.micronaut.platform)) {
        exclude group: 'org.paas'
        exclude group: 'org.paas.nlp'
        exclude group: 'org.paas.service'
        exclude group: 'org.redisson', module: 'redisson-micronaut-40'
    }
    annotationProcessor libs.micronaut.inject.java
    annotationProcessor project(':processor')

    implementation project(':core')
    implementation project(':worker')
    implementation project(':scheduler')
    implementation project(':executor')
    implementation project(':indexer')
    implementation libs.micronaut.runtime
    implementation libs.micronaut.test.junit5
    api libs.micronaut.http.client

    implementation libs.junit.jupiter.engine
    implementation libs.junit.jupiter.params

    api libs.hamcrest.core
    api libs.hamcrest.library
    api libs.mockito.junit.jupiter
    api libs.assertj.core.pinned
    api libs.junit.platform.launcher

    testImplementation libs.archunit.junit5
}
