plugins {
    id 'org.flow.build.base'
    alias(libs.plugins.micronaut.application)
    alias(libs.plugins.shadow)
    alias(libs.plugins.micronaut.aot)
    id 'java-library'
}

// 将代码中的 repositories 替换为如下所示
repositories {
    maven {
        url = uri(repoUrl)
        allowInsecureProtocol = true
    }
    mavenCentral()
    gradlePluginPortal()
}

configurations.configureEach {
    exclude group: "io.netty", module: "netty-transport-native-io_uring"
    exclude group: "io.netty", module: "netty-transport-classes-io_uring"
    resolutionStrategy {
        force(libs.hikaricp)
    }
}

dependencies {
    api(project(':scheduler'))
    implementation(libs.pass.authx)

    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)
    annotationProcessor(libs.micronaut.http.validation)

    implementation(libs.micronaut.http.client)
    implementation(libs.micronaut.discovery.client)
    implementation(libs.micronaut.elasticsearch)
    implementation(libs.micronaut.jackson.databind)
    implementation(libs.jackson.dataformat.yaml)
    api(libs.opentelemetry.exporter.otlp)

    runtimeOnly(libs.logback.classic)

    testImplementation(libs.micronaut.validation)
    testImplementation(libs.logback.classic)
    testRuntimeOnly(libs.junit.platform.launcher)
    testCompileOnly(libs.lombok)
    testAnnotationProcessor(libs.lombok)
    testAnnotationProcessor(libs.micronaut.http.validation)
}

application {
    mainClass = "org.cses.flow.Application"
}

graalvmNative.toolchainDetection = false

micronaut {
    runtime("netty")
    testRuntime("junit5")
    processing {
        incremental(true)
        annotations("org.cses.flow.*")
    }
    aot {
        optimizeServiceLoading = false
        convertYamlToJava = false
        precomputeOperations = true
        cacheEnvironment = true
        optimizeClassLoading = true
        deduceEnvironment = true
        optimizeNetty = true
        replaceLogbackXml = true
    }
}

tasks.named("dockerfileNative") {
    jdkVersion = "21"
}

tasks.configureEach {
    if (name in ["shadowJar", "optimizedJitJarAll"]) {
        zip64 = true
        mergeServiceFiles()
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

// HTTP UC 共用现有真实 PostgreSQL/Pulsar 服务夹具，不引入 Core 测试类。
sourceSets.test.java {
    srcDir('../core/src/test/java')
    include('org/cses/flow/controller/**')
    include('org/cses/flow/ServerModuleArchitectureTest.java')
    include('org/cses/flow/core/services/executions/WorkflowUcFixture.java')
    include('org/cses/flow/infrastructure/jooq/PostgresJooqTestAdapter.java')
    include('org/cses/flow/infrastructure/datapilot/FlowDataSourceEngineTestSupport.java')
    include('org/cses/flow/infrastructure/jooq/FlowJooqTestConfiguration.java')
    include('org/cses/flow/infrastructure/queues/pulsar/PulsarTestEnvironment.java')
    include('org/cses/flow/infrastructure/websocket/NoopWebsocketRepository.java')
}
dependencies {
    testImplementation(libs.paas.pulsar)
    testImplementation(libs.org.x9.cloud.datapilot)
}
// Webhook HTTP 验收不装配宿主 Temporal/Redis 调度，沿用 Core 的测试环境边界。
configurations.matching { it.name.startsWith('test') }.configureEach {
    exclude group: 'org.paas', module: 'paas-temporal'
}
