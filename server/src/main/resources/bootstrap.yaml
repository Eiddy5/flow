micronaut:
  config-client:
    enabled: true

consul:
  client:
    registration:
      enabled: true
      preferIpAddress: true
      check:
        deregister-critical-service-after: 1m

    defaultZone: [ "http://${NODE_IP:consul-server.consul-cses.svc.cluster.local}:8500" ] # pre
    #    defaultZone: [ "http://193.168.2.100:32266" ] # dev
    #    defaultZone: [ "http://192.168.6.200:8500" ] # oldPre
#    defaultZone: [ "http://192.168.6.6:8500" ] # prod
    #    defaultZone: [ "http://consul-test-2-0.consul-test-2.consul.svc.cluster.local:8500" ] # dev (打包使用)
    config:
      format: "YAML"
      datacenter: "beijing"
      separator: "/"
      raw: true
      path: "x9-config-flow"
    watch:
      service:
        enabled: true
    blocking-queries:
      max-wait-duration: 10m
      delay-duration: 50ms
