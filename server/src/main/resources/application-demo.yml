micronaut:
  config-client:
    enabled: false
  server:
    host: ${FLOW_DEMO_HOST:0.0.0.0}
  router:
    static-resources:
      flow-demo:
        mapping: /demo/**
        paths:
          - classpath:flow-demo

consul:
  client:
    registration:
      enabled: false
    config:
      enabled: false
    watch:
      service:
        enabled: false

flow:
  studio:
    enabled: true
    session-binder:
      enabled: true
    company-id: ${FLOW_DEMO_COMPANY_ID:flow-demo}
    user-id: ${FLOW_DEMO_USER_ID:demo-user}
    user-name: ${FLOW_DEMO_USER_NAME:Flow Demo User}
  demo:
    enabled: true
    postgres:
      url: ${FLOW_DEMO_POSTGRES_URL:jdbc:postgresql://localhost:5432/flow}
      user: ${FLOW_DEMO_POSTGRES_USER:flow}
      password: ${FLOW_DEMO_POSTGRES_PASSWORD:flow}

grpc:
  server:
    health:
      enabled: false
