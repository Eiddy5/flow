micronaut:
  config-client:
    enabled: ${FLOW_DEMO_PLATFORM_MANAGED:false}
  server:
    host: ${FLOW_DEMO_HOST:0.0.0.0}
  router:
    static-resources:
      flow-demo:
        mapping: /demo/**
        paths:
          - classpath:flow-demo

consul:
  client:
    registration:
      enabled: ${FLOW_DEMO_PLATFORM_MANAGED:false}
    config:
      enabled: ${FLOW_DEMO_PLATFORM_MANAGED:false}
    watch:
      service:
        enabled: ${FLOW_DEMO_PLATFORM_MANAGED:false}

flow:
  demo:
    enabled: true
    platform-managed: ${FLOW_DEMO_PLATFORM_MANAGED:false}
    session-binder:
      enabled: true
    company-id: ${FLOW_DEMO_COMPANY_ID:flow-demo}
    user-id: ${FLOW_DEMO_USER_ID:demo-user}
    user-name: ${FLOW_DEMO_USER_NAME:Flow Demo User}
    postgres:
      url: ${FLOW_DEMO_POSTGRES_URL:`jdbc:postgresql://localhost:5432/flow`}
      user: ${FLOW_DEMO_POSTGRES_USER:flow}
      password: ${FLOW_DEMO_POSTGRES_PASSWORD:flow}

grpc:
  server:
    health:
      enabled: false
