micronaut:
  application:
    name: flow
  openapi:
    tag:
      generation:
        by:
          package:
            enabled: true
        remove:
          prefixes:
            - org.flow.server.service.
        naming:
          strategy: KEBAB_CASE
  mcp:
    server:
      transport: HTTP
      info:
        name: flow-mcp-server
        version: "${CSES_MCP_VERSION:1.0.0}"
  config-client:
    enabled: true
  metrics:
    enabled: true
    binders:
      jvm: true
      logback: true
      uptime: true
      netty:
        queues:
          enabled: false
        channels:
          enabled: true
    export:
      prometheus:
        enabled: true
        step: 5s
  server:
    thread-selection: AUTO
    idle-timeout: 3m
    port: 3434
    notFoundOnMissingBody: false
    cors:
      enabled: true
      configurations:
        default:
          allowed-origins-regex: ".*"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
  router:
    versioning:
      enabled: true
      default-version: v1
      parameter:
        enabled: true
        names: v,api-version
      header:
        enabled: true
        names:
          - X-API-VERSION
          - Accept-Version
    static-resources:
      admin:
        enabled: true
        mapping: "/admin/**"
        paths: classpath:admin
  http:
    services:
      mattermost-http-im-local:
        url: "http://cses-im-server.cses.svc.cluster.local:8066"

cluster:
  dataCenter: "beijing"
  clusterName: "okr"
jackson:
  serializationInclusion: NON_NULL
  serialization:
    WRITE_DATES_AS_TIMESTAMPS: false
  mapper-features:
    ACCEPT_CASE_INSENSITIVE_ENUMS: true
    DETECT_PARAMETER_NAMES: false

endpoints:
  health:
    elasticsearch:
      enabled: false
    discovery-client-health:
      enabled: false
  metrics:
    enabled: true
    sensitive: false
  prometheus:
    enabled: true
    sensitive: false

redisson:
  cluster-servers-config:
    node-addresses:
      - "redis://redis-cses-pre-redis-cluster-headless.redis-cses.svc.cluster.local:6379"
    master-connection-pool-size: 256
    master-connection-minimum-idle-size: 64
    slave-connection-pool-size: 256
    slave-connection-minimum-idle-size: 64
    subscription-connection-pool-size: 100
  codec1: org.redisson.codec.MsgPackJacksonCodec

datasources:
  default:
    url: jdbc:postgresql://postgresql-cses-pre-cnpg-rw.postgres-cses.svc.cluster.local:5432/cses?readOnlyMode=ignore
    driverClassName: org.postgresql.Driver
    autoCommit: true
    maximum-pool-size: 300
    minimum-idle: 1
    idle-timeout: 300000
    max-lifetime: 600000
    connection-timeout: 30000
    validation-timeout: 30000
    leak-detection-threshold: 60000
    password: "one.2013"
    username: "postgres"
  flow:
    url: ${FLOW_DATASOURCE_URL:`jdbc:postgresql://127.0.0.1:5432/flow`}
    username: ${FLOW_DATASOURCE_USERNAME:flow}
    password: ${FLOW_DATASOURCE_PASSWORD:flow}
    driver-class-name: org.postgresql.Driver
    maximum-pool-size: ${FLOW_DATASOURCE_MAXIMUM_POOL_SIZE:10}
    minimum-idle: ${FLOW_DATASOURCE_MINIMUM_IDLE:2}
jooq:
  send-event: true

database:
  mongo: "okr"
  mysql: "okr"
  neo4j: "okr"
  postgresql: "mattermost"


pulsar:
  development: false
  service-url: "pulsar://pulsar-cses-broker.pulsar-cses.svc.cluster.local:6650"

websocket:
  reliable-message:
    enabled: true
    enabled-channels: []
    buffer-expire-ms: 60000
    max-buffer-size: 500

grpc:
  server:
    instance-id: 'flow-grpc'
    enabled: false
    port: 3388
    trace:
      enabled: false
  client:
    plaintext: true
    discovery:
      enabled: false
    trace:
      enabled: false
    max-retry-attempts: 10
thrift:
  server:
    instance-id: 'flow-thrift'
    enabled: false
  client:
    discovery:
      enabled: false

