dependencies {
    api project(':gen')
    api(platform(libs.micronaut.platform)) {
        exclude group: 'org.paas'
        exclude group: 'org.paas.nlp'
        exclude group: 'org.paas.service'
        exclude group: 'org.redisson', module: 'redisson-micronaut-50'
    }
    implementation platform(libs.micrometer.bom)
    // Micronaut bean metadata is generated only in modules that own beans.
    annotationProcessor(platform(libs.micronaut.platform)) {
        exclude group: 'org.paas'
        exclude group: 'org.paas.nlp'
        exclude group: 'org.paas.service'
        exclude group: 'org.redisson', module: 'redisson-micronaut-50'
    }
    annotationProcessor libs.micronaut.inject.java
    annotationProcessor libs.micronaut.validation.processor

    implementation libs.micronaut.context
    implementation libs.micronaut.validation.runtime
    implementation libs.micronaut.micrometer.core
    implementation libs.micrometer.core
    implementation libs.failsafe

    testAnnotationProcessor(platform(libs.micronaut.platform)) {
        exclude group: 'org.paas'
        exclude group: 'org.paas.nlp'
        exclude group: 'org.paas.service'
        exclude group: 'org.redisson', module: 'redisson-micronaut-50'
    }
    testAnnotationProcessor libs.micronaut.inject.java
    testImplementation libs.micronaut.test.junit5
    testImplementation libs.assertj.core.pinned

    implementation(libs.micronaut.data.tx.jdbc)
    implementation(libs.micronaut.jdbc.hikari)
    implementation(libs.micronaut.jooq) {
        exclude group: 'io.micronaut', module: 'micronaut-http-server-netty'
        exclude group: 'org.apache.pulsar', module: 'pulsar-client-admin-original'
        exclude group: 'org.redisson', module: 'redisson-micronaut-50'
    }
    // see https://github.com/jOOQ/jOOQ/issues/14865
    compileOnly (libs.jakarta.xml.bind.api)

    runtimeOnly(libs.postgresql)
}
