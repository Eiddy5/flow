plugins { id 'java-library' }

sourceSets {
    codegen {
        java.srcDir 'src/codegen/java'
    }
}

dependencies {
    // Internal jOOQ 3.21 uses Micronaut 5/PaaS 2 in its published defaults.
    // Keep its complete family aligned while using the Java 21-compatible host libraries.
    ['api', 'codegenImplementation'].each { configuration ->
        add(configuration, platform(libs.micronaut.platform)) {
            exclude group: 'org.paas'
            exclude group: 'org.paas.nlp'
            exclude group: 'org.paas.service'
            exclude group: 'org.redisson', module: 'redisson-micronaut-40'
            exclude group: 'com.fasterxml.jackson', module: 'jackson-bom'
        }
        add(configuration, enforcedPlatform(libs.jooq.bom))
        add(configuration, enforcedPlatform(libs.paas.bom))
    }
    api(libs.jooq) {
        exclude group: 'io.micronaut', module: 'micronaut-http-server-netty'
    }
    api(libs.jooq.paas) {
        exclude group: 'io.micronaut.sql', module: 'micronaut-jooq'
        exclude group: 'io.micronaut', module: 'micronaut-http-server-netty'
    }
    implementation(libs.micronaut.jooq) {
        exclude group: 'io.micronaut', module: 'micronaut-http-server-netty'
    }
    implementation libs.micronaut.data.model

    codegenImplementation(libs.jooq.codegen.extension) {
        exclude group: 'io.micronaut.sql', module: 'micronaut-jooq'
        exclude group: 'io.micronaut', module: 'micronaut-http-server-netty'
    }
    codegenRuntimeOnly(libs.micronaut.jooq) {
        exclude group: 'io.micronaut', module: 'micronaut-http-server-netty'
    }
    codegenRuntimeOnly libs.postgresql
    codegenRuntimeOnly libs.micronaut.data.model

    testImplementation sourceSets.codegen.output
}

configurations.testImplementation.extendsFrom(configurations.codegenImplementation)

tasks.register('generateJooq', JavaExec) {
    group = 'code generation'
    description = 'Generate Flow PostgreSQL objects from an explicitly configured database.'
    dependsOn tasks.named('codegenClasses')
    classpath = sourceSets.codegen.runtimeClasspath
    mainClass = 'org.flow.gen.codegen.JooqFlowGenerator'
    workingDir = projectDir
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
